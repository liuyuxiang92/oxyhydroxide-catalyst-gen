# Architectural decisions — what was chosen and why
- name: abcde_ooh_stays_tier3_specialized
  scope: src/abcde_ooh/, src/rl_matdesign/predictors/ooh.py
  decision: |
    Keep OOH-specific code (adsorbate placement, Sabatier overpotential,
    5-phase rules) in `src/abcde_ooh/` rather than fully unifying into
    `rl_matdesign/`. Bridge via two adapters: `predictors/ooh.py`
    (OOHCatalystPredictor → wraps DeepMDOverpotentialPredictor) and
    `registry.py:_make_ooh` (cfg-dict factory).
  rationale: |
    1. OOH physics (place O*, OH*, OOH* adsorbates → 3 binding energies →
       overpotential) is genuinely domain-specific; collapsing it into the
       generic `DPStructurePredictor` would lose the structure.
    2. The 5-phase OOH rules include cross-element inequalities like
       `Fe <= max(Ni, Co)` that exceed what the declarative `phase_pattern`
       grammar should encode. Keeping `PhaseActionFilter` in Python is
       cleaner than building a mini-language.
    3. Minimal-touch reduces risk of breaking the OOH bit-for-bit parity
       gate (the `v1.0-parity-with-classical` tag).
  consequences: |
    `abcde_ooh/` remains importable; `predictor: ooh` + `constraint_filter:
    ooh_phase` route to it via registry. Two adapters and a `DPConfig.output_index`
    field are the only `abcde_ooh/`-adjacent additions.
  status: confirmed

- name: phase_pattern_scoped_to_simple_rules
  scope: src/rl_matdesign/constraints/phase_pattern.py
  decision: |
    PhasePatternFilter supports `required` / `forbidden` / `primary_sum` /
    `dopant_sum` (incl. `ALL_OTHERS` sentinel) / `ratios`. Multi-pattern OR.
    Thorough action filter at terminal step only; intermediate steps pass
    through.
  rationale: |
    Covers ~80% of common phase rules cleanly. Cross-element inequalities
    and intermediate-step interval arithmetic over remaining-element subsets
    would balloon the grammar and runtime. For OOH-style complex rules,
    write a dedicated `ConstraintFilter` subclass instead — that's Tier 3.
  status: confirmed

- name: charge_neutrality_whole_formula
  scope: src/rl_matdesign/constraints/charge.py, smact_filter.py, registry.py, training.py
  decision: |
    `smact_charge` now checks AMOUNT-WEIGHTED neutrality on the WHOLE formula
    (cations + every anion at real amounts), not the old unweighted cation-set
    screen against an assumed anion stoich. Single utility `charge_neutral()`
    (constraints/charge.py) integerizes the composition and searches for one
    oxidation state per element with Σ amount·ox == 0. Used by both the
    in-episode SMACTChargeFilter (final step) and a post-episode `charge_ok`
    column in generate_candidates.
  rationale: |
    1. Old filter ignored amounts, used a hardcoded anion stoich (1.5), and
       double-counted O for oxides — it wasn't actually checking neutrality.
    2. Must use pymatgen `common_oxidation_states` (Fe→{2,3}), NOT smact's broad
       `.oxidation_states` (Fe→{1..6}) which makes almost anything "balance".
       smact is therefore NOT required anymore.
    3. NOT smact_validity: that asks "is SOME stoichiometry neutral"; we have a
       FIXED stoichiometry (agent picked it) so must weight by real amounts.
    4. "Whole formula before substitution" (host+anions for builder scenarios) is
       surfaced via a `scaffold_formula` / `scaffold_poscar`+`scaffold_site_symbol`
       param INSIDE the smact_charge block (the chain passes only the filter's own
       sub-config, so it can't read top-level anion_formula/poscar).
  consequences: |
    Single opt-in switch = presence of `smact_charge` in YAML
    (registry.smact_charge_enabled -> bool drives both in-episode pruning and the
    post-episode drop; absent → nothing runs, no smact import). No `mode` knob and
    no charge_ok column: when enabled, generation ALWAYS drops non-neutral
    candidates so generated.csv holds only neutral compositions (user preference,
    2026-06-22). Deprecated `smact_anions` still honored but anions in species_set
    (agent-picked, e.g. oxide O) excluded from scaffold to avoid double-counting.
    Oxide configs dropped their smact_anions block.
  reference: plan temporal-questing-dragonfly; tests/test_charge_neutrality.py
  status: confirmed

- name: branch_safety_pattern
  scope: refactor workflow
  decision: |
    Before any non-trivial refactor: (1) tag the current known-good state
    (`vX.Y-<short-name>`), (2) work on a `feat/<topic>` branch off the
    development branch, (3) merge back only after the bit-for-bit regression
    gate passes. Defer orthogonal changes (e.g., branch reorganisation) to
    separate sessions.
  rationale: |
    Couples one risk per session. The tag is a guaranteed rollback point;
    the feature branch can be force-pushed/rebased without losing history.
  reference: tags `v1.0-parity-with-classical`, `v2.0-yaml-first`
  status: confirmed
