# GPU / HPC production environment (Linux + CUDA 12.x)
#
# Applies the same blas=*=openblas fix as environment.yml.
# PyTorch and DeepMD-kit are installed with CUDA 12.x support.
#
# Usage:
#   conda env create -f environment-gpu.yml
#   conda activate ooh-catalyst-gpu
#
# If your cluster uses CUDA 11.x, change:
#   pytorch-cuda=12.1  →  pytorch-cuda=11.8
#   deepmd-kit[torch,cu12]  →  deepmd-kit[torch,cu11]

name: ooh-catalyst-gpu

channels:
  - pytorch
  - conda-forge
  - nodefaults

dependencies:
  - python=3.10

  # --- Core scientific stack ---
  - blas=*=openblas
  - numpy
  - scipy
  - scikit-learn

  # --- Utilities ---
  - tqdm
  - joblib
  - pandas

  # --- Materials chemistry ---
  - pymatgen
  - matminer
  - ase

  # --- PyTorch + CUDA 12.x ---
  - pytorch::pytorch
  - pytorch::pytorch-cuda=12.1
  - pytorch::torchaudio
  - pytorch::torchvision

  # --- DeepMD-kit with CUDA 12 ---
  - pip
  - pip:
    - -e .
    - deepmd-kit[torch,cu12]
