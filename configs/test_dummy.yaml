# Test config using dummy predictor (no ASE/DeepMD required)
groups:
  - name: alloy
    kind: composition
    species_set: [Co, Cr, Fe, Mn, Ni, Al, Ti, Cu, V, Mo]
    fraction_set: {min: 0.05, max: 0.80, step: 0.05}   # was the env's implicit default grid
    n_components: 5
anion_formula: ""
predictor: dummy
pg_warmup_eps: 20
pg_num_iters: 10
pg_batch_eps: 5
pg_lr_actor: 0.001
pg_lr_critic: 0.001
pg_entropy_coef: 0.01
gen_temperature: 1.0
gen_top_frac: 0.0
gen_epsilon: 0.0
gamma: 0.99
pg_repeat_penalty_coef: 0.1
pg_repeat_penalty_shape: log
num_gen_eps: 20
exploration_gen_eps: 10
dqn_lr: 0.001
dqn_batch_size: 32
# Classical online DQN (used when --method dqn with general-framework)
dqn_warmup_eps: 20
dqn_num_train_eps: 100
dqn_buffer_size: 1000
dqn_grad_steps_per_ep: 5
dqn_target_update_freq: 20
dqn_eps_anneal_eps: 50
dqn_eps_min: 0.05
