# Test config using dummy predictor (no ASE/DeepMD required)
cation_set: [Co, Cr, Fe, Mn, Ni, Al, Ti, Cu, V, Mo]
anion_formula: ""
n_components: 5
predictor: dummy
constraint_filter: null
pg_warmup_eps: 20
pg_num_iters: 10
pg_batch_eps: 5
pg_lr_actor: 0.001
