# OOH catalyst configuration — classical online DQN, Monte-Carlo-return target
#
# Identical to configs/ooh_dqn.yaml except `dqn_target_mode: mc`. This is the
# non-bootstrap variant used to test whether our DQN's edge over the reference
# npj DQN comes from bootstrapping: instead of the one-step TD target
# `r + gamma*max_a' Q_target(s',a')`, every (state, action) regresses to the
# fixed discounted Monte-Carlo return G (gamma=0.9), matching the reference.
#
# Run the A/B comparison at equal budget/seeds:
#   python scripts/run_experiment.py --config configs/ooh_dqn.yaml    --out runs/dqn_bootstrap ...
#   python scripts/run_experiment.py --config configs/ooh_dqn_mc.yaml --out runs/dqn_mc        ...
# then compare top-K `reward` in generated.csv.


# ---- Environment ----
species_set:
  - Mg
  - Ca
  - Sc
  - Ti
  - Cu
  - Sr
  - Y
  - Zr
  - Hf
  - Bi
  - La
  - Ce
  - Pr
  - Nd
  - Sm
  - Eu
  - Gd
  - Tb
  - Dy
  - Ho
  - Er
  - Tm
  - Yb
  - Lu
  - Co
  - Ni
  - Fe
  - Mn

fraction_set:
  - "0.05"
  - "0.10"
  - "0.15"
  - "0.20"
  - "0.25"
  - "0.30"
  - "0.35"
  - "0.40"
  - "0.45"
  - "0.50"
  - "0.55"
  - "0.60"
  - "0.65"
  - "0.70"
  - "0.75"
  - "0.80"

anion_formula: "O2H1"
n_components: 5

constraint_filter: ooh_phase
target_phases:
  - any

# ---- Predictor ----
predictor: ooh
base_poscar: POSCAR
dp_models:
  - 20260514_oc22_1.ckpt.pt
  - 20260514_oc22_2.ckpt.pt
  - 20260514_oc22_3.ckpt.pt
  - 20260514_oc22_4.ckpt.pt
  - 20260514_oc22_5.ckpt.pt
objective: mean_plus_kstd
k: 1.0
n_random_configs: 10              # --dp-n-random-configs 10
ads_height: 1.9
ads_dz: 1.0
geo_opt: false
geo_opt_model: "./DPA-3.1-3M_1.pt"
uncertainty: models

# ---- RL method ----
method: dqn

# ---- DQN hyperparameters ----
dqn_warmup_eps: 1000              # --dqn-warmup-eps 1000  (old flag: --warmup-eps)
dqn_num_train_eps: 20000              # --num-train-eps 20000
dqn_buffer_size: 50000                # --buffer-size 50000
dqn_batch_size: 32                # --dqn-batch-size 32  (old flag: --batch-size)
dqn_grad_steps_per_ep: 5              # --grad-steps-per-ep 5
dqn_target_update_freq: 10            # inert when dqn_target_mode: mc
dqn_eps_anneal_eps: 15000             # --eps-anneal-eps 15000
dqn_eps_min: 0.05                     # --eps-min 0.05
gamma: 0.9                        # discount for the MC return (matches reference disc_factor)
dqn_lr: 0.001                     # default (--dqn-lr not specified in command)
dqn_hidden_dim: 256               # matches classical-dqn QRegressor default

# ---- Target mode (mc-target experiment; remove with the code fences) ----
dqn_target_mode: mc               # non-bootstrap: regress to fixed discounted MC return G

# ---- Generation ----
num_gen_eps: 2000                 # --num-gen-eps 2000 (second occurrence overrides first 1000)
exploration_gen_eps: 0
gen_temperature: 1.0
gen_top_frac: 0.0
gen_epsilon: 0.0
