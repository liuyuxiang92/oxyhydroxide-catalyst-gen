# Smoke test for the multi_group env wiring (no ASE/DeepMD; dummy predictor).
# Two sublattice groups, each sums to 1 (P-site and S-site shaped).
env_type: multi_group
groups:
  - name: P_site
    cation_set: [Mn, Ni, P]
    fraction_set: ["0.05", "0.10", "0.90", "0.95"]
    total_units: 20
    n_components: 2
  - name: S_site
    cation_set: [S, O, Cl]
    fraction_set: ["0.20", "0.30", "0.70", "0.80"]
    total_units: 10
    n_components: 2

predictor: dummy

pg_warmup_eps: 20
pg_num_iters: 8
pg_batch_eps: 5
pg_lr_actor: 0.001
pg_lr_critic: 0.001
pg_entropy_coef: 0.01
gen_temperature: 1.0
gen_top_frac: 0.0
gen_epsilon: 0.0
gamma: 0.99
pg_repeat_penalty_coef: 0.1
pg_repeat_penalty_shape: log
num_gen_eps: 15
exploration_gen_eps: 5
dqn_lr: 0.001
dqn_batch_size: 32
dqn_warmup_eps: 20
dqn_num_train_eps: 60
dqn_buffer_size: 1000
dqn_grad_steps_per_ep: 5
dqn_target_update_freq: 20
dqn_eps_anneal_eps: 40
dqn_eps_min: 0.05
