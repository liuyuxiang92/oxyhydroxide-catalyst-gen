# HEA case study configuration
# Usage:
#   python scripts/run_experiment.py --config configs/hea.yaml --method a2c \
#       --out runs/hea_a2c_seed0 --seed 0


# ---- Environment ----
cation_set:
  - Co
  - Cr
  - Fe
  - Mn
  - Ni
  - Al
  - Ti
  - Cu
  - V
  - Mo
  - W
  - Nb
  - Ta
  - Hf
  - Zr

fraction_set:
  - "0.05"
  - "0.10"
  - "0.15"
  - "0.20"
  - "0.25"
  - "0.30"
  - "0.35"
  - "0.40"
  - "0.45"
  - "0.50"
  - "0.55"
  - "0.60"
  - "0.65"
  - "0.70"
  - "0.75"
  - "0.80"

anion_formula: ""         # No anion for metallic alloys
n_components: 5           # Classic 5-component HEA

constraint_filter: null   # No chemical constraint; DPA reward handles stability

# ---- Predictor ----
predictor: structure_score        # the one structure-based predictor
builder: substitute               # fixed-lattice element swap onto placeholder sites
poscar: data/hea/FCC.POSCAR       # FCC supercell template; change to BCC.POSCAR if needed
site_symbol: "X"                  # placeholder element in the POSCAR template
n_random_configs: 5               # random configs per composition during RL training
k: 1.0
properties:
  - name: energy
    backend: energy               # DP potential energy (lower = more stable)
    models:
      - models/hea/model_1.pt
      - models/hea/model_2.pt
      - models/hea/model_3.pt
    direction: min                # minimize formation energy
    objective: mean_minus_kstd    # exploit (use mean_plus_kstd to explore)

# ---- RL hyperparameters ----
method: a2c                # Default method (overridable via --method)
pg_warmup_eps: 200
pg_num_iters: 500
pg_batch_eps: 15
pg_lr_actor: 0.001
pg_lr_critic: 0.001
pg_entropy_coef: 0.01
gen_temperature: 1.0
gen_top_frac: 0.0
gen_epsilon: 0.0
gamma: 0.99

pg_repeat_penalty_coef: 0.1
pg_repeat_penalty_shape: log

# ---- Generation ----
num_gen_eps: 200          # Exploitation candidates
exploration_gen_eps: 50   # Exploration candidates (high dp_std; for DFT validation)

# ---- DQN-specific (only used when --method dqn) ----
dqn_lr: 0.001
dqn_batch_size: 256
# Classical online DQN
dqn_warmup_eps: 200
dqn_num_train_eps: 20000
dqn_buffer_size: 50000
dqn_grad_steps_per_ep: 5
dqn_target_update_freq: 100
dqn_eps_anneal_eps: 10000
dqn_eps_min: 0.05
