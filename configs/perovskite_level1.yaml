# Perovskite Level 1 — ABO3, A-site and B-site each ONE element from the same
# 73-element pool (73*73 = 5,329 candidates, exactly enumerable — see the
# separate ground-truth enumeration script, kept outside this repo). Reward =
# DPA4 relaxation -> MGTransformer formation_energy_peratom (lower is better).
#
# REAL predictor calls throughout: every episode/trial of every method (DQN
# bootstrap/mc, A2C, BO, GA) calls the real DPA4-relax -> MGTransformer
# pipeline for every NEW composition it encounters. There is no lookup-table
# shortcut — see scripts/submit_perovskite_sweep.sh's header.
#
# REQUIRED USER EDITS before running (see comments at each key below):
#   mgt_repo / mgt_python   — path to the MGTransformer checkout + its own
#                             conda env's python (see ../MGTransformer)
#   geo_opt.head            — verify at run time; see the comment there
#   dqn_num_train_eps / dqn_eps_anneal_eps / pg_num_iters
#                           — set by hand per budget sweep call, see the table
#                             below and scripts/submit_perovskite_sweep.sh
#
# Usage:
#   python scripts/run_experiment.py --config configs/perovskite_level1.yaml \
#       --method dqn --dqn-target-mode bootstrap --out runs/perovskite_l1/dqn_bootstrap \
#       --train-seed 0 --dp-seed 0 --gen-seed 0
#   (or --method dqn --dqn-target-mode mc / --method a2c; BO/GA via
#    scripts/baselines/run_bo.py / run_ga.py — see submit_perovskite_sweep.sh)

# ---- Environment: two 1-slot categorical groups, one pick each ----
env_type: multi_group

groups:
  - name: A_site
    kind: categorical
    choices:
      - element: A
        values:
          [Li, Be, B,
           Na, Mg, Al, Si,
           K, Ca, Sc, Ti, V, Cr, Mn, Fe, Co,
           Ni, Cu, Zn, Ga, Ge, As,
           Rb, Sr, Y, Zr, Nb, Mo, Tc, Ru, Rh,
           Pd, Ag, Cd, In, Sn, Sb, Te,
           Cs, Ba, Lu, Hf, Ta, W, Re, Os, Ir,
           Pt, Au, Hg, Tl, Pb, Bi,
           La, Ce, Pr, Nd, Pm, Sm, Eu, Gd, Tb,
           Dy, Ho, Er, Tm, Yb,
           Ac, Th, Pa, U, Np, Pu]
  - name: B_site
    kind: categorical
    choices:
      - element: B
        values:
          [Li, Be, B,
           Na, Mg, Al, Si,
           K, Ca, Sc, Ti, V, Cr, Mn, Fe, Co,
           Ni, Cu, Zn, Ga, Ge, As,
           Rb, Sr, Y, Zr, Nb, Mo, Tc, Ru, Rh,
           Pd, Ag, Cd, In, Sn, Sb, Te,
           Cs, Ba, Lu, Hf, Ta, W, Re, Os, Ir,
           Pt, Au, Hg, Tl, Pb, Bi,
           La, Ce, Pr, Nd, Pm, Sm, Eu, Gd, Tb,
           Dy, Ho, Er, Tm, Yb,
           Ac, Th, Pa, U, Np, Pu]

constraint_filter: null   # full 73x73 space, no A/B restriction

# ---- Reward: build (site_pick) -> relax (DPA4) -> score (MGTransformer) ----
builder: site_pick
base_poscar: perovskite.vasp          # SrFeO3 template; Sr=A-site, Fe=B-site placeholders
site_map: {A_site: Sr, B_site: Fe}
n_random_configs: 1                    # single-element sites — nothing random to average

geo_opt:
  model: perovskite_dpa4.ckpt.pt
  # head: <REQUIRED USER EDIT — verify before the first real run. If this
  #        checkpoint is a multi-task DPA4 model, the first geo_opt call raises
  #        "head is not None" (same failure hit before with the Ti-alloy
  #        multi-task checkpoints — see trace.md 2026-06-01). Inspect the
  #        checkpoint's available heads on the GPU machine and set this key;
  #        leave it commented (no head kwarg) only if the model is single-task.
  fmax: 0.01
  steps: 200
  relax_cell: true

properties:
  - name: formation_energy
    predictor: rl_matdesign.predictors.mgtransformer:MGTransformerPredictor
    direction: min
    target: formation_energy_peratom
    mgt_repo: ../MGTransformer              # REQUIRED USER EDIT if run from elsewhere
    mgt_python: /path/to/MGTransformer/env/bin/python   # REQUIRED USER EDIT
    device: cpu                             # or cuda:0 — matches serve.py --device
    # Raw MGTransformer output is an UNCALIBRATED, RELATIVE score for this
    # target, not eV/atom (see predict.py's docstring) — fine for finding the
    # argmin, not for reporting an absolute formation energy.

# ---- RL hyperparameters ----
# Budget table (dqn_warmup_eps fixed at 20; pg_batch_eps fixed at 10 — vary
# ONLY dqn_num_train_eps / pg_num_iters across a sweep, never both warmup and
# batch size, per the established lesson in scripts/submit_sweep.sh's header):
#
#   budget   dqn_num_train_eps   dqn_eps_anneal_eps   pg_num_iters
#      100            80                  48                10
#      250           230                 138                25
#      500           480                 288                50
#     1000           980                 588               100
#
# Values below are set for budget=100 — edit before each
# scripts/submit_perovskite_sweep.sh call to match the budget you're launching.
method: dqn
dqn_lr: 0.001
dqn_batch_size: 64
dqn_warmup_eps: 20
dqn_num_train_eps: 80
dqn_buffer_size: 5000
dqn_grad_steps_per_ep: 5
dqn_target_update_freq: 20
dqn_eps_anneal_eps: 48
dqn_eps_min: 0.05

pg_warmup_eps: 50          # free (no real predictor calls) — see CLAUDE.md
pg_num_iters: 10
pg_batch_eps: 10           # fixed across the sweep
pg_lr_actor: 0.001
pg_lr_critic: 0.001
pg_entropy_coef: 0.05
pg_entropy_min: 0.3
gamma: 0.9
pg_repeat_penalty_coef: 0.5
pg_repeat_penalty_shape: log

# ---- Generation ----
num_gen_eps: 100
gen_temperature: 1.0       # Boltzmann sampling — argmax alone would collapse
gen_top_frac: 0.0          # to one A/B pair every episode (only 2 choices total)
gen_epsilon: 0.2           # avoid a collapsed few-candidate readout, matches
                            # the oxides-sweep lesson for small generation sets
exploration_gen_eps: 0
