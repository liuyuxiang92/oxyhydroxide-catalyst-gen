# Perovskite B-site case study configuration
# Usage:
#   python scripts/run_experiment.py --config configs/perovskite.yaml --method a2c \
#       --out runs/perovskite_a2c_seed0 --seed 0


# ---- Environment ----
# B-site candidates (transition metals compatible with La3+ A-site and O2- anion)
species_set:
  - Cr
  - Mn
  - Fe
  - Co
  - Ni
  - Ti
  - V
  - Cu
  - Zr
  - Nb
  - Mo

fraction_set:
  - "0.05"
  - "0.10"
  - "0.15"
  - "0.20"
  - "0.25"
  - "0.30"
  - "0.35"
  - "0.40"
  - "0.45"
  - "0.50"
  - "0.55"
  - "0.60"
  - "0.65"
  - "0.70"
  - "0.75"
  - "0.80"

# The anion formula is part of the full material but NOT part of the
# optimised composition (La and O are fixed by the template).
# Set anion_formula to "" because the RL agent only selects B-site cations.
anion_formula: ""
n_components: 5

# Optional: SMACT charge neutrality on the WHOLE LaBO3 formula. La and O are NOT
# agent-picked (they live in the template), so point the filter at the template as
# the "scaffold" — the whole formula before B-site substitution. The filter parses
# {La:1, O:3} + the B-site count from the POSCAR, merges the agent's B-site picks,
# and tests amount-weighted neutrality. No `stoich` guess needed.
# Uncomment to enable (in-episode pruning + a `charge_ok` column in generated.csv):
# constraint_filter: smact_charge
# scaffold_poscar: data/perovskite/LaBO3.POSCAR
# scaffold_site_symbol: "Fe"   # same placeholder as the builder's site_symbol
# mode: flag                   # or `filter` to drop non-neutral candidates
constraint_filter: null   # Default: no constraint; DPA reward handles stability

# ---- Reward (one structure objective -> single-objective, auto-detected) ----
builder: substitute                    # fixed-lattice element swap onto placeholder sites
poscar: data/perovskite/LaBO3.POSCAR   # LaBO3 template; B-site marked as site_symbol
site_symbol: "Fe"                      # placeholder for B-site atoms in the template POSCAR
n_random_configs: 5
k: 1.0
properties:
  - name: energy
    predictor: dp_energy               # DP potential energy (lower = more stable)
    models:
      - models/perovskite/model_1.pt
      - models/perovskite/model_2.pt
      - models/perovskite/model_3.pt
    direction: min                     # minimize formation enthalpy
    objective: mean_minus_kstd

# ---- RL hyperparameters ----
method: a2c
pg_warmup_eps: 200
pg_num_iters: 500
pg_batch_eps: 15
pg_lr_actor: 0.001
pg_lr_critic: 0.001
pg_entropy_coef: 0.01
gen_temperature: 1.0
gen_top_frac: 0.0
gen_epsilon: 0.0
gamma: 0.99

pg_repeat_penalty_coef: 0.1
pg_repeat_penalty_shape: log

# ---- Generation ----
num_gen_eps: 200
exploration_gen_eps: 50    # High-uncertainty candidates for DFT to improve DPA model

# ---- DQN-specific ----
dqn_lr: 0.001
dqn_batch_size: 256
# Classical online DQN
dqn_warmup_eps: 200
dqn_num_train_eps: 20000
dqn_buffer_size: 50000
dqn_grad_steps_per_ep: 5
dqn_target_update_freq: 100
dqn_eps_anneal_eps: 10000
dqn_eps_min: 0.05
