# HPO search-space template — OOH catalyst, A2C.
#
# Run:
#   python scripts/hpo.py \
#       --hpo-config configs/hpo/ooh_a2c.yaml \
#       --out runs/hpo/ooh_a2c_v1

base_config: ../ooh.yaml              # base ooh.yaml defaults to reinforce; we override below
study_name: ooh_a2c_search_v1
method: a2c

metric:
  kind: top_k_mean
  k: 10

optuna:
  seed: 42

stage1:
  n_trials: 30
  n_parallel_trials: 1
  seeds_per_trial: 1
  budget_scaling:
    pg_num_iters: 0.25
    pg_warmup_eps: 0.25

stage2:
  n_top_to_confirm: 3
  seeds_per_trial: 3

fixed_overrides:
  # Lock generation knobs so the HPO metric is comparable across trials.
  num_gen_eps: 100

search_space:
  pg_lr_actor:            { dist: loguniform, low: 1.0e-5, high: 5.0e-3 }
  pg_lr_critic:           { dist: loguniform, low: 1.0e-5, high: 5.0e-3 }
  pg_entropy_coef:        { dist: loguniform, low: 1.0e-3, high: 0.5 }
  pg_batch_eps:           { dist: categorical, choices: [8, 16, 32, 64] }
  pg_repeat_penalty_coef: { dist: uniform, low: 0.0, high: 20.0 }
  pg_repeat_penalty_shape: { dist: categorical, choices: [log, sqrt, linear] }
  gamma:                  { dist: uniform, low: 0.85, high: 0.99 }
