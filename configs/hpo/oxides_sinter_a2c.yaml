# HPO search-space template — oxide sintering, A2C.

base_config: ../oxides_sinter.yaml
study_name: oxides_sinter_a2c_search_v1
method: a2c

metric:
  kind: top_k_mean
  k: 10

optuna:
  seed: 42

stage1:
  n_trials: 40
  n_parallel_trials: 1
  seeds_per_trial: 2
  budget_scaling:
    pg_num_iters: 0.3
    pg_warmup_eps: 0.3

stage2:
  n_top_to_confirm: 3
  seeds_per_trial: 3

fixed_overrides:
  num_gen_eps: 200

search_space:
  pg_lr_actor:            { dist: loguniform, low: 1.0e-5, high: 5.0e-3 }
  pg_lr_critic:           { dist: loguniform, low: 1.0e-5, high: 5.0e-3 }
  pg_entropy_coef:        { dist: loguniform, low: 1.0e-3, high: 0.5 }
  pg_batch_eps:           { dist: categorical, choices: [8, 16, 32, 64] }
  pg_repeat_penalty_coef: { dist: uniform, low: 0.0, high: 20.0 }
  pg_repeat_penalty_shape:{ dist: categorical, choices: [log, sqrt, linear] }
  gamma:                  { dist: uniform, low: 0.85, high: 0.99 }
