[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-matdesign"
version = "0.1.0"
requires-python = ">=3.10"
# Dependencies are managed by the conda environment files (environment.yml /
# environment-gpu.yml). Only the package structure is declared here.

[project.scripts]
rl-matdesign = "rl_matdesign.cli:main"

[project.optional-dependencies]
# Lightweight test extras — install via `pip install -e .[dev]`. Tests are
# designed to run without DeepMD or ASE (uses dummy predictor + pure helpers).
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
